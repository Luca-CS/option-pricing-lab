<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option pricer widget</title>
<style>
  :root { color-scheme: light; --bg: #fbfaf7; --text: #17191e; --muted: #5d6370; --line: #e3e0d7; --accent: #1f3a8a;
    --serif: "Iowan Old Style", Charter, "Source Serif Pro", Cambria, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #12151b;
    --text: #e9e7e2; --muted: #9ba2ae; --line: #272c36; --accent: #a3b8ff; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #12151b; --text: #e9e7e2; --muted: #9ba2ae; --line: #272c36; --accent: #a3b8ff; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  main { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 0 0 0.3rem; }
</style>
<link rel="stylesheet" href="pricer.css">
</head>
<body>
<main>
  <h1>Option pricer</h1>
  <div class="pricer-widget" id="pricer"></div>
</main>
<script src="pricer-data.js"></script>
<script src="pricer.js"></script>
<script>PricerWidget.mount("pricer");</script>
</body>
</html>
