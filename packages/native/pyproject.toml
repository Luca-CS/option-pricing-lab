[project]
name = "optlab-native"
version = "0.1.0"
description = "optlab's compiled engine (C++/CUDA, cuda/) seen from Python; optional, found through the optlab.engines entry point"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "numpy>=2.5",
]

[project.entry-points."optlab.engines"]
native = "optlab.native"  # the engine protocol of optlab.core.engines

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]  # a portion of the PEP 420 namespace `optlab`: no optlab/__init__.py (ADR-0003)

[tool.uv.sources]
optlab-core = { workspace = true }
