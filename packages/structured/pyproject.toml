[project]
name = "optlab-structured"
version = "0.1.0"
description = "optlab's structured products: the payoff script language, term sheets, pricing policy, quotes, desk costs, books"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "numpy>=2.5",
    "scipy>=1.18",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]  # a portion of the PEP 420 namespace `optlab`: no optlab/__init__.py (ADR-0003)

[tool.uv.sources]
optlab-core = { workspace = true }
