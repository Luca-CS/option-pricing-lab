[project]
name = "optlab-server"
version = "0.1.0"
description = "optlab's desk: API v1 (FastAPI), accounts, the job queue, its worker and schedules, the SQLite database"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "optlab-native",
    "optlab-structured",
    "optlab-marketdata",
    "optlab-risk",
    "numpy>=2.5",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",  # Settings (ADR-0012)
    "sqlalchemy>=2.0.55",  # SQLAlchemy Core, no ORM (ADR-0007)
    "alembic>=1.20",  # the schema's migrations
    "fastapi>=0.162",  # API v1 (ADR-0005)
    "uvicorn>=0.54",
    "argon2-cffi>=25.1",  # password hashes (ADR-0020)
    "tzdata>=2025.2",  # the schedules' time zone (zoneinfo has no database of its own on Windows or a slim image)
    "typer>=0.27.3",  # the `optlab` command line (ADR-0010)
]

[project.scripts]
optlab = "optlab.server.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]  # a portion of the PEP 420 namespace `optlab`: no optlab/__init__.py (ADR-0003)

[tool.uv.sources]
optlab-core = { workspace = true }
optlab-native = { workspace = true }
optlab-structured = { workspace = true }
optlab-marketdata = { workspace = true }
optlab-risk = { workspace = true }
