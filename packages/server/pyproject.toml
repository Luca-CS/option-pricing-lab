[project]
name = "optlab-server"
version = "0.1.0"
description = "optlab's desk: the HTTP server, its jobs and store (the FastAPI API v1, auth and the worker replace them in A5 and A6)"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "optlab-native",
    "optlab-structured",
    "optlab-marketdata",
    "optlab-risk",
    "numpy>=2.5",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]  # a portion of the PEP 420 namespace `optlab`: no optlab/__init__.py (ADR-0003)

[tool.uv.sources]
optlab-core = { workspace = true }
optlab-native = { workspace = true }
optlab-structured = { workspace = true }
optlab-marketdata = { workspace = true }
optlab-risk = { workspace = true }
