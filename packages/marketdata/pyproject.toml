[project]
name = "optlab-marketdata"
version = "0.1.0"
description = "optlab's market data: the historical lake (Parquet, DuckDB), its sources and derivations, point-in-time markets, replays"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "optlab-structured",
    "numpy>=2.5",
    "scipy>=1.18",
    "pandas>=3.1",
    "duckdb>=2.0",
    "pyarrow>=26.0",
    "requests>=2.34",
]

[project.optional-dependencies]
yahoo = ["yfinance>=1.7"]  # personal-use option chains and closes

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optlab"]  # a portion of the PEP 420 namespace `optlab`: no optlab/__init__.py (ADR-0003)

[tool.uv.sources]
optlab-core = { workspace = true }
optlab-structured = { workspace = true }
