# The uv workspace (ADR-0003): one repository, six distributions sharing the PEP 420 namespace `optlab`, each in
# packages/<name>/src/optlab/<name> with its tests in packages/<name>/tests. The root is not a package: it installs
# them all, editable, with the tools.
[project]
name = "optlab"
version = "0.1.0"
description = "Option pricing under Black-Scholes, Heston, Dupire local volatility and Heston SLV"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "optlab-core",
    "optlab-native",
    "optlab-structured",
    "optlab-marketdata",
    "optlab-risk",
    "optlab-server",
]

[project.optional-dependencies]
yahoo = ["optlab-marketdata[yahoo]"]
reports = ["matplotlib>=3.11"]  # the charts of optlab calib run (optlab.server.tools.plots)

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-xdist>=3.8",
    "pytest-cov>=7.1",
    "ruff==0.17.2",
    "pyright==1.1.414",
    "import-linter==2.15",
    "pre-commit>=4.7",
    "nanobind==3.1.0",  # stubgen: the versioned stub of optlab.native._ext (its test compares)
    "httpx2>=2.16",  # the API tests' client (starlette TestClient; httpx is deprecated there)
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
optlab-core = { workspace = true }
optlab-native = { workspace = true }
optlab-structured = { workspace = true }
optlab-marketdata = { workspace = true }
optlab-risk = { workspace = true }
optlab-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
pythonpath = ["tests/helpers"]  # the independent references shared by several packages
markers = [
    "slow: longer than about 10 s; left out of the CI run",
    "lake: needs the real data lake (optlab-data); skipped without it",
    "gpu: needs the CUDA library and a GPU",
    "native: needs the native engine library (CPU or GPU)",
    "node: needs node on PATH (the JavaScript pricers of docs/ and the desk's table sorting)",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "*.md",  # code blocks in docs keep their hand-aligned comments
    "packages/native/src/optlab/native/_ext.pyi",  # generated by nanobind.stubgen, compared as text by its test
]

[tool.ruff.lint]
# ADR-0014: pycodestyle errors, pyflakes, import sorting, absolute imports, and since A8 complexity (C901, at most 15),
# bandit (S), bugbear (B) and pyupgrade (UP). A `noqa` in the code says why each exception is safe.
select = ["E4", "E7", "E9", "F", "I", "TID252", "C901", "S", "B", "UP"]
ignore = [
    "B905",  # zip() without strict=: several pricers zip lists of the same length by construction; strict=True would
             # turn into an error a case no test has, and strict=False everywhere would say nothing
]

[tool.ruff.lint.per-file-ignores]
# tests assert, start the interpreter and node, bind 0.0.0.0 in settings they check, and type throwaway passwords
"**/tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "S104", "B017"]
"tests/**" = ["S101", "S603", "S607"]
"deploy/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # 7 functions above it at the baseline (reports/refactor-baseline.md), none since A8

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are evaluated once, by design
extend-immutable-calls = [
    "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Depends", "fastapi.params.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["optlab"]  # a namespace spread over packages/*/src, which ruff cannot find alone

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"  # absolute `optlab.<package>` imports only (ADR-0003): a move never changes their meaning

[tool.pyright]
include = ["packages", "tests"]
extraPaths = ["tests/helpers", "packages/native/src"]  # optlab.native installs through an import hook (scikit-build-core), which pyright does not run
pythonVersion = "3.14"
pythonPlatform = "All"  # the same counts on the Windows and Linux runners
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["optlab.core", "optlab.native", "optlab.structured", "optlab.marketdata", "optlab.risk", "optlab.server"]

# The dependency direction of ADR-0004, checked in CI; grimp counts the imports inside functions too
[[tool.importlinter.contracts]]
name = "Layers: server > risk > marketdata > structured > core"
type = "layers"
layers = ["optlab.server", "optlab.risk", "optlab.marketdata", "optlab.structured", "optlab.core"]

[[tool.importlinter.contracts]]
name = "Only the server imports the compiled engine; the others ask optlab.core.engines by name"
type = "forbidden"
source_modules = ["optlab.core", "optlab.structured", "optlab.marketdata", "optlab.risk"]
forbidden_modules = ["optlab.native"]

[[tool.importlinter.contracts]]
name = "The compiled engine sees the core and the basket types of structured, nothing above"
type = "forbidden"
source_modules = ["optlab.native"]
forbidden_modules = ["optlab.marketdata", "optlab.risk", "optlab.server"]
