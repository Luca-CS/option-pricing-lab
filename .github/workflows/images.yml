# The container images of deploy/ (ADR-0009): built, started, scanned by Trivy. Nothing is pushed here: images go to
# GHCR from release.yml only (A9, ADR-0019). The api image builds on every change; the worker's (CUDA's devel image is
# 16 GB) when what it is built from changes, and every week for the advisories of its base images.
name: Images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api image (build, start, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The compose file is valid
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build
        run: docker build -f deploy/api.Dockerfile -t optlab-api:ci .
      - name: The image starts, unprivileged, on a read-only root
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            optlab-api:ci version
          test "$(docker run --rm --entrypoint id optlab-api:ci -u)" = 10001
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: optlab-api:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  worker:
    name: worker image (build, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the worker's build change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) from="$BASE" ;;
            *) from="$BEFORE" ;;
          esac
          if git diff --quiet "$from" HEAD -- deploy/worker.Dockerfile .dockerignore uv.lock packages/native pyproject.toml \
              packages/*/pyproject.toml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Room for CUDA's devel image (the runner's preinstalled toolchains go)
        if: steps.changed.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: Build
        if: steps.changed.outputs.build == 'true'
        run: docker build -f deploy/worker.Dockerfile -t optlab-worker:ci .
      - name: The image starts (no GPU on the runner, so the NumPy and CPU engines)
        if: steps.changed.outputs.build == 'true'
        run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL optlab-worker:ci version
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: steps.changed.outputs.build == 'true'
        with:
          scan-type: image
          image-ref: optlab-worker:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
