# Updates come as pull requests, reviewed and merged by hand, never automatically (docs/architecture/security.md).
# A cooldown lets a new release age two weeks before it is proposed. The images of deploy/ (base images by digest in
# the Dockerfiles' FROM lines, Caddy in compose.yaml) joined in A7, the front's npm comes in session 2; npm here is the
# API contract's client check (api/client-check).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: "Deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
  - package-ecosystem: npm
    directory: /api/client-check
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      client-check:
        patterns: ["*"]
    commit-message:
      prefix: "Deps"
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Images"
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Images"
